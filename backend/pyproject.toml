[project]
name = "money-movement"
version = "1.0.0"
description = "Closed-ecosystem money movement platform - PSTU IT Carnival 2026"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "redis>=5.2",
    "pika>=1.3",
    "python-json-logger>=3.1",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.8",
    "import-linter>=2.1",
    "ruff>=0.8",
    "locust>=2.32",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["apps", "modules", "platform_"]

# ---------------------------------------------------------------------------
# Ruff - lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = ["S101"]  # assert is used deliberately to enforce financial invariants

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "ARG001", "ARG002"]
# Alembic revision files are machine-generated; reformatting them would make
# future autogenerate diffs noisy for no benefit.
"alembic/versions/*" = ["E501", "N999", "ARG001"]
"alembic/*" = ["N999", "ARG001"]
# The API speaks camelCase on the wire because that is the JSON convention
# clients expect. These are field names in a serialisation contract, not
# Python variables, so the snake_case rule does not apply.
"apps/api/schemas.py" = ["N815"]
# FastAPI declares dependencies as parameters. Some exist purely to enforce
# authentication and are intentionally not referenced in the body.
"apps/api/routes/*" = ["ARG001"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a real PostgreSQL instance",
    "concurrency: proves behaviour under simultaneous requests",
    "slow: long-running",
]
filterwarnings = ["error::DeprecationWarning"]
# The app logs structured JSON to stdout; at INFO that buries test output.
log_cli = false

# ---------------------------------------------------------------------------
# import-linter - turns the hexagonal dependency rule into a CI gate.
# Spec 7.1: "Domain logic must not import controllers, ORM entities, Redis
# clients, or broker libraries." This makes that statement falsifiable.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["modules", "apps", "platform_"]
# Required so the "forbidden" contracts can name third-party packages
# (fastapi, sqlalchemy, redis, pika) as things the domain must not import.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Financial core domain is framework-free"
type = "forbidden"
source_modules = ["modules.financial_core.domain"]
forbidden_modules = [
    "fastapi", "sqlalchemy", "redis", "pika", "psycopg", "alembic", "uvicorn",
]

[[tool.importlinter.contracts]]
name = "All domain layers are framework-free"
type = "forbidden"
source_modules = [
    "modules.identity.domain",
    "modules.users.domain",
    "modules.money_request.domain",
]
forbidden_modules = ["fastapi", "sqlalchemy", "redis", "pika", "psycopg"]

[[tool.importlinter.contracts]]
name = "Hexagonal layering: domain <- application <- adapters"
type = "layers"
layers = ["adapters", "application", "domain"]
containers = [
    "modules.financial_core",
    "modules.identity",
    "modules.users",
    "modules.money_request",
]

[[tool.importlinter.contracts]]
name = "Domain never depends on another module's internals"
type = "independence"
modules = [
    "modules.financial_core.domain",
    "modules.identity.domain",
    "modules.users.domain",
    "modules.money_request.domain",
]
