# Spec 17.3: health-aware routing, no sticky sessions, request-id propagation,
# TLS terminated here in production.
#
# The API address is resolved at *request* time, not at startup. A static
# `upstream` block resolves its hostnames once when nginx loads its config and
# caches the addresses forever, so recreating an API container - a deploy, a
# restart, a scale-up - leaves nginx dialling an IP that no longer exists and
# every request 502s. Using Docker's embedded DNS (127.0.0.11) with a short
# validity, plus a variable in proxy_pass to force re-resolution, means new
# replicas are picked up automatically. Docker returns one A record per
# replica and rotates them, which is where the load balancing comes from.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Spec 21.3: strict request body limit.
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Spec 21.3 / 23.1: generate a request id if the client did not supply one.
    set $req_id $http_x_request_id;
    if ($req_id = "") { set $req_id $request_id; }

    location /api/ {
        set $api_backend "http://api:8000";
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $req_id;

        # Surface which replica served the request - proves statelessness in the demo.
        add_header X-Upstream $upstream_addr always;
        add_header X-Request-Id $req_id always;

        proxy_connect_timeout 3s;
        proxy_send_timeout   15s;
        proxy_read_timeout   15s;

        # Money mutations must never be silently replayed onto another replica
        # by the proxy: retrying a POST is the client's job, with its
        # idempotency key. Spec 12.4.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 1;
    }

    location = /health {
        set $health_backend "http://api:8000";
        proxy_pass $health_backend/api/v1/health/ready;
        access_log off;
    }

    # The built single-page app. Same origin as the API, so no CORS.
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # Client-side routing: unknown paths fall back to the app shell.
        try_files $uri /index.html;

        # The app shell must never be cached. Asset filenames are content
        # hashed and served immutable above, so the only thing that tells a
        # browser a new build exists is index.html itself. Cached, it keeps
        # requesting the previous bundle and a deployed fix never arrives.
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
